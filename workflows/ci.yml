name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train deterministic demo model
        run: python scripts/train_demo_model.py

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Verify application imports
        env:
          PYTHONPATH: .
        run: |
          python -c "import app"
          python -c "from api.main import app as api_app; print(api_app.title)"
